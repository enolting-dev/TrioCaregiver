name: Temporary secure Match transfer
on: workflow_dispatch
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer to LoopWorkspace encrypted secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MATCH_VALUE: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -eu
          test -n "$MATCH_VALUE"
          test -n "$GH_TOKEN"
          printf %s "$MATCH_VALUE" | gh secret set MATCH_PASSWORD --repo enolting-dev/LoopWorkspace
